<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D爱心手势识别</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #fff;
            touch-action: none;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video {
            width: 100%;
            max-width: 640px;
            height: auto;
            display: none;
            transform: scaleX(-1); /* 翻转摄像头 */
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            max-width: 800px;
            margin: 0 auto;
            font-size: 1.2em;
            animation: pulse 2s infinite;
            z-index: 10;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        h1 {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: #ff6b6b;
            animation: beat 1.5s infinite;
            z-index: 5;
        }
        @keyframes beat {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            color: #fff;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3D爱心手势识别</h1>
        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="canvas-container"></div>
        <div class="instructions">
            👉 用拇指和食指比出心形 👉 张开手掌让爱心绽放
        </div>
        <div class="heart">❤️</div>
        <div class="loading" id="loading">加载中... 请稍候</div>
    </div>

    <!-- 引入Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入MediaPipe手势识别 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1694421849/hands.min.js"></script>

    <script>
        // 3D爱心
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 创建3D爱心
        const heartGeometry = new THREE.ParametricGeometry(heartShape, 32, 32);
        const heartMaterial = new THREE.MeshPhongMaterial({
            color: 0xff6b6b,
            emissive: 0xff0000,
            emissiveIntensity: 0.5,
            shininess: 100
        });
        const heart = new THREE.Mesh(heartGeometry, heartMaterial);
        heart.scale.set(0.5, 0.5, 0.5);
        scene.add(heart);

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xff6b6b, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        camera.position.z = 5;

        // 3D爱心形状函数
        function heartShape(u, v, target) {
            const x = 16 * Math.pow(Math.sin(u), 3);
            const y = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
            const z = -16 * Math.pow(Math.sin(u), 3);
            target.set(x, y, z);
        }

        // 设置初始状态
        let isHeartClosed = true;
        let targetScale = 1;
        let currentScale = 1;

        // 摄像头设置
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        // 初始化手势识别
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1694421849/${file}`;
            }
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // 启动摄像头
        function startCamera() {
            loading.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        loading.style.display = 'none';
                        video.style.display = 'block';
                        // 用canvas捕获视频帧
                        setInterval(() => {
                            hands.send({ image: video });
                        }, 100);
                    };
                })
                .catch(error => {
                    console.error('无法访问摄像头', error);
                    loading.textContent = '请允许访问摄像头！';
                    loading.style.color = '#ff6b6b';
                });
        }

        // 手势识别结果处理
        function onResults(results) {
            if (results.multiHandLandmarks) {
                const landmarks = results.multiHandLandmarks[0];
                if (isHeartGesture(landmarks)) {
                    targetScale = 1.0;
                    isHeartClosed = true;
                } else if (isPalmOpen(landmarks)) {
                    targetScale = 2.0;
                    isHeartClosed = false;
                }
            }
        }

        // 检测爱心手势
        function isHeartGesture(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2) +
                Math.pow(thumbTip.z - indexTip.z, 2)
            );
            // 阈值0.05（相对值，单位是0-1）
            if (distance < 0.05) {
                // 检查其他手指是否弯曲
                const wrist = landmarks[0];
                const fingers = [12, 16, 20]; // 中指、无名指、小指
                let allBent = true;
                for (const fingerTip of fingers) {
                    const fingerDist = Math.sqrt(
                        Math.pow(landmarks[fingerTip].x - wrist.x, 2) +
                        Math.pow(landmarks[fingerTip].y - wrist.y, 2) +
                        Math.pow(landmarks[fingerTip].z - wrist.z, 2)
                    );
                    if (fingerDist > 0.2) { // 阈值0.2
                        allBent = false;
                        break;
                    }
                }
                return allBent;
            }
            return false;
        }

        // 检测手掌打开
        function isPalmOpen(landmarks) {
            const wrist = landmarks[0];
            const fingers = [8, 12, 16, 20]; // 所有指尖
            let sumDist = 0;
            for (const fingerTip of fingers) {
                const dist = Math.sqrt(
                    Math.pow(landmarks[fingerTip].x - wrist.x, 2) +
                    Math.pow(landmarks[fingerTip].y - wrist.y, 2) +
                    Math.pow(landmarks[fingerTip].z - wrist.z, 2)
                );
                sumDist += dist;
            }
            const avgDist = sumDist / fingers.length;
            return avgDist > 0.25; // 阈值0.25
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 平滑过渡到目标缩放
            currentScale += (targetScale - currentScale) * 0.1;
            heart.scale.set(currentScale, currentScale, currentScale);

            // 旋转爱心
            heart.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化
        window.onload = function() {
            // 检查是否在iOS设备
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) {
                // iOS需要手动触发摄像头
                document.body.addEventListener('touchstart', startCamera, { once: true });
            } else {
                // 其他设备自动启动
                startCamera();
            }
            animate();
        };
    </script>
</body>
</html>
