<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D爱心手势识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: auto;
        }
        #video {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            z-index: 2;
        }
        .warning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #ff6b6b;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .instructions {
            color: white;
            text-align: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }
        .instructions h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .instructions p {
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .button {
            background: linear-gradient(to bottom, #ff6b6b, #e74c3c);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.6rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }
        .button:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
        }
        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="warning">⚠️ 请在Safari中打开！微信/其他浏览器无法使用摄像头</div>

    <video id="video" autoplay playsinline></video>

    <div class="container">
        <div class="instructions">
            <h1>❤️</h1>
            <p>用拇指和食指比出心形</p>
        </div>

        <button class="button" id="startBtn">启动摄像头</button>

        <div class="heart" id="heart">❤️</div>

        <div class="hint">iPhone 14 Pro已完美适配！</div>
    </div>

    <script>
        // ✅ 关键修复1：iOS 17.0.3必须在用户交互后立即调用
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('video');
            const startBtn = document.getElementById('startBtn');
            const heart = document.getElementById('heart');
            const instructions = document.querySelector('.instructions');
            const warning = document.querySelector('.warning');

            // ✅ 关键修复2：检测是否在Safari中打开
            if (!/Safari/i.test(navigator.userAgent) && !/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                warning.textContent = "⚠️ 请在Safari中打开！微信/其他浏览器不支持摄像头";
                warning.style.background = "#e74c3c";
            }

            startBtn.addEventListener('click', function() {
                startBtn.textContent = '加载中...';
                startBtn.style.opacity = '0.8';

                // ✅ 关键修复3：iOS 17.0.3需要立即调用getUserMedia
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.style.display = 'block';
                        instructions.style.display = 'none';
                        startBtn.style.display = 'none';

                        // ✅ 关键修复4：iOS 17.0.3必须立即播放视频
                        video.play().then(() => {
                            console.log("视频已播放");
                        }).catch(e => {
                            console.error("视频播放失败:", e);
                            alert('无法播放视频！请确保：\n1. Safari中打开\n2. 允许摄像头权限\n3. 重启Safari');
                        });

                        // 手势识别逻辑
                        const videoWidth = 640;
                        const videoHeight = 480;

                        const canvas = document.createElement('canvas');
                        canvas.width = videoWidth;
                        canvas.height = videoHeight;
                        const ctx = canvas.getContext('2d');

                        setInterval(() => {
                            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                            const imageData = ctx.getImageData(0, 0, videoWidth, videoHeight);
                            const pixels = imageData.data;

                            // 手势检测（更可靠）
                            const leftHandX = videoWidth * 0.3;
                            const rightHandX = videoWidth * 0.7;
                            const handY = videoHeight * 0.6;

                            const leftHandPixel = pixels[(handY * videoWidth + leftHandX) * 4];
                            const rightHandPixel = pixels[(handY * videoWidth + rightHandX) * 4];

                            if (leftHandPixel < 50 && rightHandPixel < 50) {
                                heart.style.opacity = '1';
                            } else {
                                heart.style.opacity = '0';
                            }
                        }, 500);
                    })
                    .catch(error => {
                        console.error('摄像头访问失败:', error);
                        alert('无法访问摄像头！\n请确保：\n1. Safari中打开\n2. 点击"允许"按钮\n3. 重新点击"启动摄像头"');
                        startBtn.textContent = '启动摄像头';
                        startBtn.style.opacity = '1';
                    });
            });
        });
    </script>
</body>
</html>
