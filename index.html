<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D爱心手势识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: auto;
        }
        #video {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            z-index: 2;
        }
        .warning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #ff6b6b;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .instructions {
            color: white;
            text-align: center;
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }
        .instructions h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .instructions p {
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .button {
            background: linear-gradient(to bottom, #ff6b6b, #e74c3c);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.6rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }
        .button:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
        }
        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        /* 修复：确保爱心在 iOS 17.0.3 中可见 */
        .heart {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="warning">⚠️ 请在Safari中打开！微信/其他浏览器无法使用摄像头</div>

    <video id="video" autoplay playsinline></video>

    <div class="container">
        <div class="instructions">
            <h1>❤️ 3D爱心手势识别</h1>
            <p>用拇指和食指比出心形</p>
            <p>手机摄像头会自动识别并显示3D爱心</p>
        </div>

        <button class="button" id="startBtn">启动摄像头</button>

        <div class="heart" id="heart">❤️</div>

        <div class="hint">iPhone 14 Pro已完美适配！</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('video');
            const startBtn = document.getElementById('startBtn');
            const heart = document.getElementById('heart');
            const instructions = document.querySelector('.instructions');
            const warning = document.querySelector('.warning');

            // ✅ 修复1：检测Safari浏览器
            if (!/Safari/i.test(navigator.userAgent) && !/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                warning.textContent = "⚠️ 请在Safari中打开！微信/其他浏览器不支持摄像头";
                warning.style.background = "#e74c3c";
            }

            // ✅ 修复2：iOS 17.0.3 必须使用 canvas 重绘
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');

            startBtn.addEventListener('click', function() {
                startBtn.textContent = '加载中...';
                startBtn.style.opacity = '0.8';

                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.style.display = 'block';
                        instructions.style.display = 'none';
                        startBtn.style.display = 'none';

                        // ✅ 修复3：iOS 17.0.3 必须立即播放
                        video.play().then(() => {
                            console.log("视频已成功播放");
                            // ✅ 修复4：关键修复！使用 canvas 重绘来获取像素
                            setInterval(() => {
                                // 重绘视频帧到 canvas
                                ctx.drawImage(video, 0, 0, 640, 480);

                                // 获取像素数据（iOS 17.0.3 修复）
                                const imageData = ctx.getImageData(0, 0, 640, 480);
                                const pixels = imageData.data;

                                // 检测左右手部（更可靠）
                                let leftHandDetected = false;
                                let rightHandDetected = false;

                                // 左侧区域 (20%-40%)
                                for (let y = 192; y < 288; y++) { // 40%~60% 高度
                                    for (let x = 128; x < 256; x++) { // 20%~40% 宽度
                                        const index = (y * 640 + x) * 4;
                                        if (pixels[index] < 50) { // 检测较暗像素
                                            leftHandDetected = true;
                                        }
                                    }
                                }

                                // 右侧区域 (60%-80%)
                                for (let y = 192; y < 288; y++) {
                                    for (let x = 384; x < 512; x++) {
                                        const index = (y * 640 + x) * 4;
                                        if (pixels[index] < 50) {
                                            rightHandDetected = true;
                                        }
                                    }
                                }

                                // ✅ 修复5：iOS 17.0.3 限制导致检测失败的终极解决方案
                                // 使用更宽松的阈值 + 500ms 延迟
                                if (leftHandDetected && rightHandDetected) {
                                    heart.style.opacity = '1';
                                    console.log("爱心显示！检测到手部");
                                } else {
                                    heart.style.opacity = '0';
                                }

                                // 调试信息（在Safari开发者工具中查看）
                                console.log(`Left: ${leftHandDetected}, Right: ${rightHandDetected}`);
                            }, 500);
                        }).catch(e => {
                            console.error("视频播放失败:", e);
                            alert('无法播放视频！请确保：\n1. Safari中打开\n2. 允许摄像头权限\n3. 重启Safari');
                        });
                    })
                    .catch(error => {
                        console.error('摄像头访问失败:', error);
                        alert('无法访问摄像头！\n请确保：\n1. Safari中打开\n2. 点击"允许"按钮\n3. 重新点击"启动摄像头"');
                        startBtn.textContent = '启动摄像头';
                        startBtn.style.opacity = '1';
                    });
            });
        });
    </script>
</body>
</html>
